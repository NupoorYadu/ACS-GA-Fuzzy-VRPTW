name: CI

on:
  push:
  pull_request:

jobs:
  test-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run unit/manual tests
        run: |
          python tests/run_tests_manual.py

      - name: Smoke import and CLI check
        run: |
          python - <<'PY'
import importlib
# smoke import check
m = importlib.import_module('src.aco.acs')
print('Imported', m.__name__)
# try to run CLI module to show it's runnable (no external data required)
import subprocess, sys
try:
    res = subprocess.run([sys.executable, 'scripts/run_acs.py', '--help'], check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
    print('run_acs.py --help ok')
except Exception as e:
    print('run_acs.py help failed:', e)
    raise
PY

      - name: Run a fast end-to-end smoke experiment
        run: |
          python scripts/run_acs.py --instance data/solomon_dataset/parsed/SAMPLE/sample1.json --ants 4 --iters 8 --out-dir results/ci_smoke --seed 42
